[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biomatchar"
version = "0.1.0"
description = "Characterization data pipeline and AI agent for biomaterial films (FTIR, XRD, tensile, TGA, SEM)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas>=2.0", "scipy", "matplotlib", "openpyxl", "pyyaml", "pillow"]

[project.optional-dependencies]
agent = ["anthropic"]
dev = ["pytest"]

[project.scripts]
biomatchar = "biomatchar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
